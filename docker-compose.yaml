services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /home/django/db_project/db_project
    command: poetry run python3 manage.py runserver 0.0.0.0:8070
    volumes:
      - ./:/home/django/db_project
    ports:
      - "8070:8070"
    depends_on:
      - postgres
      - redis
    networks:
      - db_project_network

  postgres:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql@14/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-1234}
      - POSTGRES_DB=${POSTGRES_DB:-db_project_postgres}
      - ALLOWED_HOSTS=localhost,127.0.0.1,app
    networks:
      - db_project_network

  redis:
    image: redis:7
    container_name: db_project_redis_cache
    restart: always
    networks:
      - db_project_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./site.conf:/etc/nginx/conf.d/site.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "crm.com:host-gateway"
    networks:
      - db_project_network
    depends_on:
      - app
      - frontend
  
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - NEXT_PUBLIC_API_URL=http://localhost:8070/api
    ports:
      - "3001:3000"
    depends_on:
      - app
    networks:
      - db_project_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  db_project_network:
    name: db_project_network
    driver: bridge
